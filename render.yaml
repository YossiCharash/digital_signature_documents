# Render Blueprint – Document Delivery API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    runtime: docker
    name: document-delivery

    dockerfilePath: docker/Dockerfile
    dockerContext: .

    # Must bind 0.0.0.0 and Render's injected $PORT, otherwise Render cannot
    # detect an open port and the deploy hangs on "No open ports detected".
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: APP_NAME
        value: Document Delivery
      - key: APP_VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMS_PROVIDER
        value: api
      - key: S3_ENABLED
        value: "true"
      - key: S3_REGION
        value: us-east-1
      - key: S3_PRESIGNED_URL_EXPIRATION
        value: "3600"
      - key: S3_CLEANUP_RETENTION_DAYS
        value: "7"
      - key: RATE_LIMIT_REQUESTS
        value: "30"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: MAX_UPLOAD_BYTES
        value: "20971520"
      # Render terminates TLS and rewrites X-Forwarded-For, so it can be trusted
      # as the source of the client IP for rate limiting.
      - key: TRUST_PROXY_HEADERS
        value: "true"

      # Secrets - set in the Render dashboard (sync: false prompts on first deploy)

      # Comma-separated "label:key" pairs. While unset, the document endpoints
      # accept unauthenticated requests so that already-distributed copies of
      # api_client.ps1 keep working; /deliveries always requires a key. Set this
      # once every client sends the X-API-Key header.
      - key: API_KEYS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Only when EMAIL_PROVIDER=sendgrid
      - key: SENDGRID_API_KEY
        sync: false
      # Only when EMAIL_PROVIDER=mailjet
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: SMS_API_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_NAME
        sync: false
      - key: SMS_FROM_NUMBER
        sync: false
